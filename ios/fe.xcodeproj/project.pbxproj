			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\n\n# sentry-cli's source map auto-upload hits \"Permission denied (os error 13)\"\n# in this build environment (root cause not yet identified — not Xcode's\n# User Script Sandboxing, that's already off). Disabling auto-upload so the\n# archive isn't blocked on it; source maps can be uploaded separately once\n# the underlying permission issue is diagnosed.\nexport SENTRY_DISABLE_AUTO_UPLOAD=true\n\nWITH_ENVIRONMENT=\"$REACT_NATIVE_PATH/scripts/xcode/with-environment.sh\"\n# sentry-xcode.sh wraps the real bundler script and needs its path passed\n# in as an argument — this was missing entirely, so with SENTRY_DISABLE_AUTO_UPLOAD\n# set, sentry-xcode.sh's fallback (`/bin/sh -c \"$REACT_NATIVE_XCODE\"`) ran\n# with an empty path, silently bundling nothing and crashing the app on\n# launch with \"No script URL provided\".\nREACT_NATIVE_XCODE=\"$REACT_NATIVE_PATH/scripts/react-native-xcode.sh\"\nSENTRY_XCODE=\"$REACT_NATIVE_PATH/../@sentry/react-native/scripts/sentry-xcode.sh\"\n\n# Source (not exec) with-environment.sh so its NODE_BINARY export lands in\n# this same shell, then call sentry-xcode.sh directly with an explicit\n# argument. Not using `/bin/sh -c \"$WITH_ENVIRONMENT $SENTRY_XCODE $REACT_NATIVE_XCODE\"`\n# here — with-environment.sh only ever reads its own first argument ($1)\n# and silently ignores anything after it, so a second argument passed that\n# way never reaches sentry-xcode.sh (this was tried and confirmed broken).\n. \"$WITH_ENVIRONMENT\"\n\"$SENTRY_XCODE\" \"$REACT_NATIVE_XCODE\"\n";
